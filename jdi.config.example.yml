# .jdi/config.yml — JDI workflow configuration
#
# Copy this to `.jdi/config.yml` at the root of a repository, or let `/jdi:init`
# write it for you. Every key is optional; the full schema and the defaults are
# in this plugin's reference/config.md.

tracker:
  # linear | jira | github | none
  # Anything else is treated as a custom tracker: JDI uses whatever integration
  # is available for it and degrades to `none` if there is none.
  name: linear

  # Default project or board for new issues.
  project: "Backend"

  # Team, workspace, or organisation the project lives in.
  team: "Engineering"

  # Issue key prefix. Used to build plan slugs and to recognise whether the
  # current branch already names the issue.
  id_prefix: "ENG"

  # First line of the comment JDI upserts on an issue when research lands.
  # Keep it stable so the write stays idempotent.
  research_comment_heading: "## 🔬 Research findings (JDI)"

split:
  # What the split pieces become, on top of the task files in the plan folder.
  #   commits    — nothing but task files and one commit each (the default)
  #   tasks      — mirror each piece as a task/checklist item on the issue, where the
  #                tracker has one; falls back to commits, out loud, where it does not
  #   subtickets — mirror each piece as a child issue of the plan's issue
  pieces: subtickets

tdd:
  # true  — the Executor writes the failing test first, once it has seen the suite
  #         run. Tests and implementation still land in the same commit, one per task.
  # false — whatever order the task calls for (the default)
  enabled: true

  # Prose an agent reads and translates into an invocation, never a string to
  # execute — the real invocation is usually not runnable as typed. Leave it empty
  # to have the Butler work it out from the repo.
  test_instructions: "run `bin/rails test` inside the devcontainer"

plans:
  # repo     — plans are files in this repository, committed with the code.
  # external — plans live in a note service; nothing plan-shaped is committed.
  mode: repo
  path: plans

  # external mode only:
  # service: obsidian
  # location: "Work/Engineering plans"

docs:
  # Where architecture docs live. /jdi:research reads from here and writes here.
  path: doc

git:
  # "auto" detects it from `git symbolic-ref refs/remotes/origin/HEAD`.
  default_branch: auto

  # Optional branch prefix. Leave empty to follow the repo's CLAUDE.md.
  branch_prefix: ""

# Optional. The model each role runs on, and optionally the agent CLI it runs
# in. A role with no entry — or no block at all — runs in this session's
# harness on the session's own model. That is supported, not degraded.
models:
  researcher:
    model: gpt-5.1-codex-max
    harness: codex
  planner:
    model: opus
    harness: ""
  splitter:
    model: qwen3-coder
    harness: opencode
  executor:
    model: opus
    harness: ""
  synthesizer:
    model: sonnet
    harness: ""
  pr-writer:
    model: sonnet
    harness: ""
  feedbacker:
    model: gpt-5.1
    harness: codex

# Optional. Per-CLI settings, keyed by the kind a `models.<role>.harness`
# names. `args` and `env` are passed through verbatim: JDI composes nothing,
# translates nothing between kinds, and adds no flag of its own. Write
# absolute paths — a leading "~" arrives as a literal tilde.
harnesses:
  claude:
    args: []
    env: {}
  codex:
    args: ["--sandbox", "workspace-write"]
    env: {}
  opencode:
    args: []
    env: {OPENCODE_CONFIG_DIR: /home/you/.config/opencode-jdi}

# Optional. Sibling repos or clients that consume this repo's public interfaces.
# The Researcher sweeps these when a change alters an externally-consumed
# contract, so "does a client need updating?" is never left unanswered.
consumers: []
