# .jdi/config.yml — JDI workflow configuration
# Schema, defaults, and example model mappings: reference/config.md

tracker:
  # linear | jira | github | none
  name: github

  # Default project or board for new issues.
  project: "feature development"

  # Team, workspace, or organisation the project lives in.
  team: "dabit"

  # Issue key prefix, e.g. "ENG" for ENG-1234. GitHub issues are bare numbers
  # (#123), so there is no prefix — plan slugs use the issue number.
  id_prefix: ""

  # First line of the comment JDI upserts on an issue when research lands.
  # Keep it stable so the write stays idempotent.
  research_comment_heading: "## 🔬 Research findings (JDI)"

split:
  # What a split piece becomes, on top of the task file and its commit.
  #   commits    — nothing written to the tracker (the default)
  #   tasks      — mirror each piece as a checklist item in the issue body
  #   subtickets — mirror each piece as a GitHub sub-issue
  pieces: commits

tdd:
  # Whether the Executor writes the failing test before the implementation.
  #   false — whatever order the task calls for (the default)
  #   true  — test first, once the suite has been seen to run. Tests and the
  #           implementation still land in the same commit, one per task.
  enabled: true

  # Prose an agent reads and translates into an invocation, never a string to
  # execute. Empty means the Butler works it out from the repo.
  test_instructions: "python3 -m unittest discover -s tests -v, from the repository root. No install step and no third-party packages."

jev:
  # Roles may ask Jev for the typed judgments in reference/jev.md (J1–J5). Jev
  # narrows a list a role already has; it never decides, writes, or commits, and
  # an unavailable Jev means the role reads every candidate itself.
  # The key lives in $TYPESAFE_API_KEY or ~/.config/typesafe/api_key, never here.
  enabled: true

plans:
  # repo     — plans are files in this repository, committed with the code.
  # external — plans live in a note service; nothing plan-shaped is committed.
  mode: repo
  path: plans

docs:
  # Where architecture docs live. /jdi:research reads from here and writes here.
  path: docs

git:
  # "auto" detects it from `git symbolic-ref refs/remotes/origin/HEAD`.
  default_branch: auto

  # Optional branch prefix. Left empty to follow the repo's AGENTS.md.
  branch_prefix: ""

# Claude Code's Agent tool takes a model alias, not a full identifier, so
# these are aliases — the same values agents/*.md frontmatter carried before
# 1.0.5. No `harness:` is set: every role runs in whatever harness this
# session is. Another harness will say once that it cannot express these and
# run the role on the session's own model.
models:
  researcher:
    model: opus
  planner:
    model: opus
  splitter:
    model: sonnet
  executor:
    model: opus
  synthesizer:
    model: sonnet
  pr-writer:
    model: sonnet
  feedbacker:
    model: opus
